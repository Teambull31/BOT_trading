name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Installer uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Installer Python et les dependances
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"

      - name: Linting
        run: .venv/bin/python -m ruff check src tests scripts

      - name: Formatage
        run: .venv/bin/python -m ruff format --check src tests scripts

      - name: Tests unitaires et d'integration
        run: .venv/bin/python -m pytest tests/unit tests/integration -q

      - name: Tests de backtest
        run: .venv/bin/python -m pytest tests/backtest -q
