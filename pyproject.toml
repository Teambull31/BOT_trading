[project]
name = "adaptive-trader"
version = "0.1.0"
description = "Agent de trading autonome adaptatif (risk-first, ensemble de strategies, detection de regime)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "hmmlearn>=0.3.2",
    "statsmodels>=0.14",
    "ta>=0.11",
    "ccxt>=4.3",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "structlog>=24.1",
    "typer>=0.12",
    "httpx>=0.27",
    "prometheus-client>=0.20",
    "apprise>=1.8",
]

[project.optional-dependencies]
ml = ["xgboost>=2.0", "optuna>=3.6", "mlflow>=2.13"]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
trader = "trader.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trader"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = ["B008", "N818", "UP042"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src/trader"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
